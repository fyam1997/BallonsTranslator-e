[project]
name = "ballonstranslator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "betterproto>=1.2.5",
    "brotlicffi>=1.1.0.0 ; sys_platform == 'win32'",
    "bs4>=0.0.2",
    "colorama>=0.4.6",
    "ctranslate2>=4.6.0",
    "deepl>=1.16.0",
    "docx2txt>=0.9",
    "einops>=0.8.1",
    "fugashi>=1.5.1",
    "httpx[brotli,socks]>=0.28.1",
    "jaconv>=0.4.0",
    "json5>=0.12.0",
    "keyboard>=0.13.5",
    "langdetect>=1.0.9",
    "mecab-python3>=1.0.10 ; sys_platform == 'darwin'",
    "msl-loadlib>=1.0.0 ; sys_platform == 'win32'",
    "multivolumefile>=0.2.3",
    "natsort>=8.4.0",
    "numpy<2",
    "openai>=1.59.5",
    "opencc-python-reimplemented>=0.1.7",
    "opencv-python>=4.8.1.78 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "opencv-python>=4.8.1.78,<=4.10.0.82 ; sys_platform == 'darwin'",
    "ordered-set>=4.1.0",
    "piexif>=1.1.3",
    "pillow-jxl-plugin>=1.3.4",
    "py7zr>=1.0.0",
    "pyclipper>=1.3.0.post6",
    "pyobjc-core>=11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-coreml>=11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=11.1 ; sys_platform == 'darwin'",
    "pyqt5>=5.15.10 ; python_full_version < '3.9'",
    "pyqt5-qt5>=5.15.2 ; python_full_version < '3.9'",
    "pyqt6>=6.6.1 ; python_full_version >= '3.9'",
    "pyqt6-qt6>=6.6.2 ; python_full_version >= '3.9'",
    "python-docx>=1.2.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "pyyaml>=6.0.2",
    "qtpy>=2.4.3",
    "requests>=2.32.4",
    "sentencepiece>=0.2.0",
    "shapely>=2.1.1",
    "spacy-pkuseg>=1.0.1",
    "termcolor>=3.1.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.54.1",
    "translators==5.9.5",
    "ultralytics==8.3.90",
    "unidic-lite>=1.0.8",
    "urllib3>=2.5.0",
    "winsdk>=1.0.0b10 ; sys_platform == 'win32'",
]

# TODO torch-backend still experimental, check if there is new solution
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
